name: Checks

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC: catch doc links that went stale
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build:css

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # assets/styles.css is build output, so it is not in the checkout
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            --exclude 'w3\.org'
            --exclude 'json-schema\.org'
            --exclude 'assets/styles\.css'
            index.html data/flow.json
          fail: true
