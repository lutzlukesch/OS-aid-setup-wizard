name: Report outdated or wrong information
description: Something in the guide is out of date or incorrect.
title: "Outdated: "
body:
  - type: input
    id: device
    attributes:
      label: Which device or app?
      placeholder: e.g. Omnipod 5 with Trio, LoopFollow, Dexcom G7
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong or out of date?
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: What is correct?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (optional)
      description: A link to official docs, release notes or an announcement.
